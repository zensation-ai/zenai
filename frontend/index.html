    <!-- Anti-FOUC: set data-theme before React hydrates so the dark theme is immediate. Default: dark. -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('zenai-theme');
          var resolved = (t === 'light') ? 'light'
            : (t === 'system') ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : 'dark';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.classList.add(resolved + '-mode');
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark-mode');
        }
      })();
    </script>
