name: Publish @zensation/cli

# Narrow on purpose.
#
# This repository is a frozen snapshot and its main pipeline is manual-only, because it
# tests files the development tree deleted (see ci.yml). The `cli/` subtree is the one
# part that is still published to npm, and it is self-contained: its own tsconfig, its
# own tests, its own lockfile. This workflow therefore builds and publishes ONLY that
# subtree, and only on a `cli-v*` tag — it never runs the snapshot's broken pipeline.
#
# Authentication is OIDC trusted publishing configured per package on npmjs.com. There
# is no NPM_TOKEN. Provenance attestations are generated automatically, which is the
# whole point: before this workflow, @zensation/cli was the only package in the
# @zensation scope without a provenance attestation.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --config jest.config.js

      - name: Build
        run: npx tsc

      # Idempotent: re-tagging a version that is already on the registry must not fail.
      - name: Publish (skip if already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zensation/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@zensation/cli@$VERSION already on npm — skipping"
          else
            npm publish --access public
          fi

      # On 2026-09-22 this step failed while the publish had SUCCEEDED
      # (`+ @zensation/cli@0.2.3`, provenance signed). Two causes, both fixed here:
      #
      #   1. A single 15 s wait is not enough. The registry needed ~75 s that day to
      #      answer for the fresh version; `npm view` returned E404 until then.
      #   2. `npm view ... | grep -q` throws npm's exit code away — the pipeline reports
      #      grep's status, so an E404 was indistinguishable from "published, but no
      #      attestation" and fell into the else branch.
      #
      # A red release job looks exactly like an unpublished package. Whoever sees it
      # re-tags and hunts a bug where there is none. The proof of a publish is the
      # receipt (`+ package@version`), not the registry a moment later.
      - name: Confirm provenance landed
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 8); do
            if ATTESTATIONS=$(npm view "@zensation/cli@$VERSION" dist.attestations --json 2>/dev/null); then
              if printf '%s' "$ATTESTATIONS" | grep -q provenance; then
                echo "Provenance attestation present for @zensation/cli@$VERSION (attempt $attempt)"
                exit 0
              fi
              echo "Attempt $attempt/8: version is visible but carries no attestation yet."
            else
              echo "Attempt $attempt/8: version not visible on the registry yet (propagation)."
            fi
            sleep 15
          done
          echo "::error::No provenance attestation for @zensation/cli@$VERSION after 8 attempts (~2 minutes)."
          echo "::error::Check the publish step above first: if it printed '+ @zensation/cli@$VERSION', the package IS published and this is a propagation or attestation problem, not a failed release. Do NOT re-tag before checking npmjs.com."
          echo "::error::Trusted publishing is configured PER PACKAGE on npmjs.com — check that @zensation/cli itself has a trusted publisher, not just the other packages."
          exit 1
