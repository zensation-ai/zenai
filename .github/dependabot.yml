version: 2
updates:
  # npm — grouped deliberately. This is a pnpm workspace with backend, frontend,
  # cli and packages; ungrouped weekly updates would open a dozen PRs at a time.
  # Two grouped PRs per week keep the signal readable.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Majors are never merged blind here — they are adopted deliberately after
      # reading the advisory or changelog. Security updates are unaffected: they
      # are delivered by Dependabot security updates, not by this file.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The major-ignore below is repeated per ecosystem on purpose: Dependabot scopes
  # `ignore` to the block it appears in. Leaving it out here opened six major PRs
  # (checkout 4->7, setup-node 4->7, cache 4->6, upload-artifact 4->7,
  # pnpm/action-setup 4->6, node 20->25-alpine) within a minute of this file landing.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
